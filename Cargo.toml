[package]
name = "typemaxxing"
version = "0.1.0"
edition = "2024"
description = "A fast, offline typing speed test for your terminal"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Surya-Varman/Typemaxxing"
homepage = "https://github.com/Surya-Varman/Typemaxxing"
keywords = ["typing", "wpm", "terminal", "tui", "monkeytype"]
categories = ["command-line-utilities", "games"]

[[bin]]
name = "tmx"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.8", features = ["derive"] }
directories = "6.0.0"
font8x8 = "0.3.1"
rand = "0.10.4"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
